name: Gerar APKs

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Opcional: assinatura fixa (permite atualizar o app sem desinstalar).
      # Crie os secrets NOIR_KEYSTORE_BASE64, NOIR_KEYSTORE_PASSWORD, NOIR_KEY_ALIAS e NOIR_KEY_PASSWORD.
      - name: Preparar chave de assinatura
        env:
          KS: ${{ secrets.NOIR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/noir.jks"
            echo "NOIR_KEYSTORE_FILE=$RUNNER_TEMP/noir.jks" >> "$GITHUB_ENV"
          fi

      - name: Compilar APKs (Android TV e celular)
        env:
          NOIR_KEYSTORE_PASSWORD: ${{ secrets.NOIR_KEYSTORE_PASSWORD }}
          NOIR_KEY_ALIAS: ${{ secrets.NOIR_KEY_ALIAS }}
          NOIR_KEY_PASSWORD: ${{ secrets.NOIR_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleTvRelease assembleMobileRelease
          mkdir -p dist
          cp app/build/outputs/apk/tv/release/*.apk dist/NOIR-AndroidTV.apk
          cp app/build/outputs/apk/mobile/release/*.apk dist/NOIR-Celular.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: NOIR-apks
          path: dist/*.apk

      - name: Publicar release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
