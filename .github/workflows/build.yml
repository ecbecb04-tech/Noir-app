name: Gerar APKs

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Opcional: assinatura fixa (permite atualizar o app sem desinstalar).
      # Crie os secrets GATOFLIX_KEYSTORE_BASE64, GATOFLIX_KEYSTORE_PASSWORD, GATOFLIX_KEY_ALIAS e GATOFLIX_KEY_PASSWORD.
      - name: Preparar chave de assinatura
        env:
          KS: ${{ secrets.GATOFLIX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/gatoflix.jks"
            echo "GATOFLIX_KEYSTORE_FILE=$RUNNER_TEMP/gatoflix.jks" >> "$GITHUB_ENV"
          fi

      - name: Compilar APKs (Android TV e celular)
        env:
          GATOFLIX_KEYSTORE_PASSWORD: ${{ secrets.GATOFLIX_KEYSTORE_PASSWORD }}
          GATOFLIX_KEY_ALIAS: ${{ secrets.GATOFLIX_KEY_ALIAS }}
          GATOFLIX_KEY_PASSWORD: ${{ secrets.GATOFLIX_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleTvRelease assembleMobileRelease
          mkdir -p dist
          cp app/build/outputs/apk/tv/release/*.apk dist/Gatoflix-AndroidTV.apk
          cp app/build/outputs/apk/mobile/release/*.apk dist/Gatoflix-Celular.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Gatoflix-apks
          path: dist/*.apk

      - name: Publicar release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
